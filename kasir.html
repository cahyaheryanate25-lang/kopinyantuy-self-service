<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Kasir KopiNyantuy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #30432a; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 24px; }
    .btn-refresh { background: #b7d68d; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #30432a; }
    
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #e6edd5; color: #30432a; }
    tr:hover { background: #fafafa; }
    
    .btn-cetak { background: #4a6741; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-hapus { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 10px; }

    #areaPrintStruk { display: none; }
    
    /* PENGATURAN CETAK (PRINT) STRUK THERMAL */
    @media print {
      body * { visibility: hidden; } 
      #areaPrintStruk, #areaPrintStruk * { visibility: visible; }
      #areaPrintStruk { 
        display: block; position: absolute; left: 0; top: 0; 
        width: 300px; /* Ukuran kertas struk kasir thermal */
        font-family: monospace; font-size: 12px; padding: 10px; color: black;
      }
      hr { border-top: 1px dashed black; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>👨‍💻 Dashboard Kasir KopiNyantuy</h1>
    <div>
      <button class="btn-refresh" onclick="muatPesanan()">🔄 Refresh Pesanan</button>
      <button class="btn-hapus" onclick="hapusSemua()">🗑️ Bersihkan Data</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Waktu</th>
        <th>Pelanggan</th>
        <th>Pesanan</th>
        <th>Total</th>
        <th>Bayar</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tabelPesanan">
    </tbody>
  </table>

  <!-- Area Sembunyi untuk Print Struk -->
  <div id="areaPrintStruk"></div>

  <script>
    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    function muatPesanan() {
      let daftarPesanan = JSON.parse(localStorage.getItem('dataPesanan')) || [];
      const tbody = document.getElementById('tabelPesanan');
      tbody.innerHTML = ''; 

      if(daftarPesanan.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 30px;">Belum ada pesanan masuk.</td></tr>';
        return;
      }

      daftarPesanan.reverse().forEach((pesanan) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${pesanan.id}</strong></td>
          <td>${pesanan.tanggal}</td>
          <td>${pesanan.nama}<br><small style="color:gray;">${pesanan.meja}</small></td>
          <td>${pesanan.menu} (x${pesanan.qty})</td>
          <td style="font-weight:bold; color:#4a6741;">${formatRupiah(pesanan.total)}</td>
          <td>${pesanan.bayar}</td>
          <td>
            <button class="btn-cetak" onclick='cetakStruk(${JSON.stringify(pesanan)})'>🖨️ Cetak Struk</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function cetakStruk(data) {
      const struk = `
        <div style="text-align:center;">
          <h2>KopiNyantuy</h2>
          <p>Jl. Nyantuy No. 10<br>Telp: 081234567890</p>
        </div>
        <hr>
        <p>ID      : ${data.id}</p>
        <p>Tgl     : ${data.tanggal}</p>
        <p>Kasir   : Admin</p>
        <p>Meja    : ${data.meja}</p>
        <p>Nama    : ${data.nama}</p>
        <hr>
        <div style="display:flex; justify-content:space-between;">
          <span>${data.menu} (x${data.qty})</span>
          <span>${formatRupiah(data.total)}</span>
        </div>
        <hr>
        <div style="display:flex; justify-content:space-between; font-weight:bold;">
          <span>TOTAL</span>
          <span>${formatRupiah(data.total)}</span>
        </div>
        <p style="margin-top:5px;">Pembayaran: ${data.bayar}</p>
        <hr>
        <p style="text-align:center;">Terima kasih atas kunjungannya!</p>
        <p style="text-align:center;">--- WiFi: kopienak123 ---</p>
      `;
      document.getElementById('areaPrintStruk').innerHTML = struk;
      window.print(); 
    }

    function hapusSemua() {
      if(confirm("Yakin ingin menghapus semua data pesanan kasir?")) {
        localStorage.removeItem('dataPesanan');
        muatPesanan();
      }
    }

    // Jalankan auto-refresh untuk dashboard kasir
    muatPesanan();
    setInterval(muatPesanan, 5000); 
  </script>
</body>
</html>
